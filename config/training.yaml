# AfterSight split designs (Phase 2) — models are added in Phase 3.
# Splits are made at SCENE level: every building of a scene lands in the same split.

seed: 42

splits:
  min_class_count_warning: 100   # flag any split where a damage class has fewer buildings than this

  designs:
    within_event:
      label: "within-event generalisation"
      description: >
        Scene-grouped, class-stratified ~70/15/15 split across all configured events. Scenes from the same
        disaster appear in train, validation and test, so scores measure generalisation to new scenes of
        disasters the model has seen — not to new disasters.
      method: stratified_group
      fractions: {train: 0.70, val: 0.15, test: 0.15}

    cross_event:
      label: "cross-event generalisation"
      description: >
        Every scene of the held-out event is the test set; train and validation come only from the other
        events (scene-grouped, class-stratified). Scores measure generalisation to an unseen disaster.
      method: event_holdout
      holdout_event: hurricane-michael
      fractions: {train: 0.85, val: 0.15}   # of the non-held-out scenes

# ---------------------------------------------------------------- Phase 3: models

# Label schemes. four_class is the primary task; three_class is a separate, clearly labelled experiment.
label_schemes:
  four_class:
    label: "4-class damage (primary)"
    mapping: {no-damage: no-damage, minor-damage: minor-damage, major-damage: major-damage, destroyed: destroyed}
  three_class:
    label: "3-class experiment (no-damage / damaged / destroyed)"
    mapping: {no-damage: no-damage, minor-damage: damaged, major-damage: damaged, destroyed: destroyed}

preprocessing:
  # Inside every pipeline, fitted on the training split only: log1p on features whose training-set
  # skewness exceeds this (non-negative features only), then median imputation, then StandardScaler.
  skew_threshold: 2.0

default_model: knn   # Triage Desk default

models:   # tuned on validation macro-F1; the best setting is evaluated on test exactly once
  baseline:
    quantile_step: 0.05        # threshold candidates = training-set quantiles of the feature at 5% steps
  logistic_regression:         # NOT a damage model of the app and not trained by scripts/train.py. Used only by the
    grid: {C: [0.01, 0.1, 1.0, 10.0]}   # feature-set experiment (scripts/run_phase3b.py, app/experiments/phase3b.py),
    max_iter: 3000                      # kept so that saved experiment stays reproducible.
  knn:
    grid: {n_neighbors: [5, 15, 31], weights: [uniform, distance]}
  decision_tree:
    grid: {max_depth: [4, 6, 8, 12], min_samples_leaf: [20, 100]}
  random_forest:               # OPTIONAL stronger classical reference, run after the required models
    optional: true
    n_estimators: 200
    grid: {max_depth: [12, null], min_samples_leaf: [2, 10]}

explain:
  permutation_sample: 4000     # stratified validation sample for permutation importance
  permutation_repeats: 5

kmeans:
  k_values: [2, 3, 4, 5, 6, 7, 8, 9, 10]
  silhouette_sample: 5000
  pca_sample: 3000             # points saved for the 2-D "visualisation only" projection

confounding:   # an analysis classifier (multinomial logistic regression) predicting EVENT from the same 37 features,
  grid: {C: [0.01, 0.1, 1.0, 10.0]}   # used only to measure the disaster fingerprint, not a damage model

# ---------------------------------------------------------------- Phase 4: what the app serves

serving:
  design: within_event          # Triage Desk models: within-event split, 4-class
  scheme: four_class
  # Served by the app (model pickers, analysis, explanations, review queue, readiness, reports): KNN (the default),
  # the Decision Tree and the saved Random Forest (marked optional above, so it never makes a tile PARTIAL).
  # Logistic Regression is not a damage model of the app. The SVM and the soft-voting ensemble are Model Arena only
  # (scripts/run_model_comparison.py).
  models: [knn, decision_tree, random_forest]

review:
  # Per model, on VALIDATION: the lowest confidence threshold t such that buildings with confidence >= t
  # are at least this accurate. Buildings below t are "suggested for human review" (not "errors").
  target_accuracy: 0.70
